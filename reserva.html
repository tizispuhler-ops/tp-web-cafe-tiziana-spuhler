    <!-- SECCION RESERVA -->
    <section class="reserva">

        <!-- LADO IZQUIERDO -->
        <div class="reserva-izquierda">

            <div class="reserva-imagen">
                <img src="imagenes/mesa.jpg" alt="Espacio de Raíza">
            </div>

            <p>Tu pausa verde, empieza acá</p>

        </div>


        <!-- LADO DERECHO -->
        <div class="reserva-derecha">

            <h1>Reserva <em>tu mesa</em></h1>

            <p>Completá tus datos para reservar tu lugar.</p>

            <form class="reserva-formulario">

                <div class="reserva-fila">

                    <div class="reserva-campo">
                        <label for="nombre">NOMBRE Y APELLIDO *</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="reserva-campo">
                        <label for="telefono">TELÉFONO *</label>
                        <input type="tel" id="telefono" name="telefono" required>
                    </div>

                </div>


                <div class="reserva-fila">

                    <div class="reserva-campo">
                        <label for="fecha">FECHA *</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>

                    <div class="reserva-campo">
                        <label for="hora">HORA *</label>
                        <select id="hora" name="hora" required>
                            <option value="">Seleccione un horario</option>
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                            <option value="12:00">12:00</option>
                            <option value="13:00">13:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                            <option value="17:00">17:00</option>
                            <option value="18:00">18:00</option>
                        </select>
                    </div>

                </div>


                <div class="reserva-fila">

                    <div class="reserva-campo">
                        <label for="personas">CANTIDAD DE PERSONAS *</label>
                        <select id="personas" name="personas" required>
                            <option value="">Seleccioná</option>
                            <option value="1">1 persona</option>
                            <option value="2">2 personas</option>
                            <option value="3">3 personas</option>
                            <option value="4">4 personas</option>
                            <option value="5">5 personas</option>
                            <option value="6">6 personas</option>
                        </select>
                    </div>

                    <div class="reserva-campo">
                        <label for="observaciones">OBSERVACIONES</label>
                        <input type="text" id="observaciones" name="observaciones">
                    </div>

                </div>


                <button type="submit" class="reserva-boton">
                    RESERVAR MESA →
                </button>

            </form>

        </div>

    </section>


    <!-- FOOTER -->
